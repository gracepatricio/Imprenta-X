name: imprentax
description: "Imprenta X System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  mobile_scanner: ^6.0.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  image: ^4.2.0
  url_launcher: ^6.3.0
  intl: ^0.20.1
  pdf: ^3.11.0
  printing: ^5.13.0
  shared_preferences: ^2.3.2
  excel: ^4.0.3
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/imprentalogo.jpg"
  web:
    generate: true
    image_path: "assets/images/imprentalogo.jpg"
  windows:
    generate: true
    image_path: "assets/images/imprentalogo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/imprentalogo.jpg
    - assets/images/sysbackground.jpg
    - assets/images/sysbackground_mobile.jpg
    - assets/images/print_floor.jpg
    - assets/images/finishing_area.jpg
    - assets/images/design_studio.jpg
  fonts:
    - family: Spartan
      fonts:
        - asset: assets/fonts/LeagueSpartan-Regular.ttf
        - asset: assets/fonts/LeagueSpartan-Bold.ttf
          weight: 700